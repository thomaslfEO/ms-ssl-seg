# Downstream U-Net + Swin Tiny defaults
# Used by: downstream/specdeepmap/train_loop.py

architecture: unet          # arch index 0
backbone: tu-swin_s3_tiny_224
pretrained_weights: [0, 1, 4]   # imagenet, none, micasense ssl
freeze_options: [true, false]
batch_size: 8
n_epochs: 50
lr: 0.0003
normalization: true
class_weights_balanced: true
data_aug: true
